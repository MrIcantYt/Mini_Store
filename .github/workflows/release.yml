name: Release

on:
  push:
    branches: [main]
    tags:
      - 'BETA-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: dist/mini-store
          - os: windows-latest
            platform: windows-x86_64
            binary: dist/mini-store.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build binary
        run: uv run pyinstaller --noconfirm --clean --onefile --name mini-store run.py

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/mini-store --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\mini-store.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mini-store-${{ github.ref_name }}-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/BETA-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          cp "artifacts/mini-store-${GITHUB_REF_NAME}-linux-x86_64/mini-store" \
            "release/mini-store-${GITHUB_REF_NAME}-linux-x86_64"
          cp "artifacts/mini-store-${GITHUB_REF_NAME}-windows-x86_64/mini-store.exe" \
            "release/mini-store-${GITHUB_REF_NAME}-windows-x86_64.exe"

          chmod +x "release/mini-store-${GITHUB_REF_NAME}-linux-x86_64"

          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Mini-Store ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false
